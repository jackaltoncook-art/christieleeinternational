<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Christie Lee International Airport — Departures</title>
<meta name="description" content="Live departures from Christie Lee International. Celebrating 40 years of first-class travel.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0a0a0a; --board:#121212; --row:#181818; --row-edge:#060606;
    --flap:#1f1f1f; --flap-hi:#2b2b2b; --split:rgba(0,0,0,.65);
    --accent:#ffd25c; --label:#8a8a84; --cream:#f2f2ee; --cream-dim:#8d8d86;
    --red:#ff6b5e;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--ink); color:var(--cream); font-family:'Jost',sans-serif;}
  body{min-height:100vh; display:flex; flex-direction:column; align-items:center; overflow-x:hidden;}

  /* ---------- Terminal sign ---------- */
  .sign-wrap{width:100%; max-width:1060px; padding:26px 14px 8px;}
  .sign{
    border:1px solid #2a2a2a; border-radius:10px;
    background:#101010; padding:24px 18px 20px; text-align:center;
    box-shadow:0 10px 34px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.04);
  }
  .signline{display:flex; align-items:center; justify-content:center; gap:16px;}
  .picto{width:clamp(30px,5vw,42px); height:clamp(30px,5vw,42px); flex:0 0 auto;
    background:var(--accent); border-radius:8px; display:flex; align-items:center; justify-content:center;}
  .picto svg{width:62%; height:62%; fill:#111;}
  .sign h1{margin:0; font-family:'Jost',sans-serif; font-weight:500; letter-spacing:.26em;
    font-size:clamp(15px,3.6vw,32px); color:var(--cream); text-transform:uppercase;}
  .sign .tag{margin:10px 0 0; font-size:clamp(10px,2vw,13px); letter-spacing:.42em; text-transform:uppercase; color:var(--label); font-weight:400;}

  /* ---------- Status strip ---------- */
  .strip{width:100%; max-width:1060px; padding:10px 14px 4px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .strip .left{display:flex; align-items:baseline; gap:14px;}
  .strip .dep{font-family:'Jost',sans-serif; font-weight:500; letter-spacing:.3em; font-size:clamp(13px,2.6vw,17px); color:var(--accent); text-transform:uppercase;}
  .clock{font-family:'Oswald',sans-serif; font-size:clamp(13px,2.6vw,18px); letter-spacing:.18em; color:var(--cream);}
  .controls{display:flex; gap:8px;}
  .pillbtn{font-family:'Jost',sans-serif; font-size:12px; letter-spacing:.14em; text-transform:uppercase;
    background:#161616; color:var(--cream-dim); border:1px solid #2e2e2e; border-radius:999px;
    padding:7px 14px; cursor:pointer; transition:.15s;}
  .pillbtn:hover{color:var(--cream); border-color:#555;}
  .pillbtn.on{color:var(--accent); border-color:var(--accent);}

  /* ---------- The board ---------- */
  .board-wrap{width:100%; max-width:1060px; padding:8px 10px 16px;}
  .board{background:var(--board); border:3px solid #0a0908; border-radius:10px; padding:10px 8px;
    box-shadow:inset 0 0 80px rgba(0,0,0,.65), 0 16px 50px rgba(0,0,0,.55);}
  .head, .row{display:grid; gap:6px; align-items:center;
    grid-template-columns:5fr 17fr 7fr 3fr 10fr;}
  .head{padding:4px 8px 8px; font-size:clamp(9px,1.6vw,12px); letter-spacing:.3em; color:var(--label); text-transform:uppercase; font-weight:500;}
  .head .r{text-align:left;}
  .row{background:linear-gradient(180deg,var(--row),#131313); border-radius:6px; padding:7px 8px; margin:5px 0;
    border:1px solid var(--row-edge); cursor:pointer; transition:transform .12s, border-color .12s; position:relative;}
  .row:hover{transform:translateY(-1px); border-color:#333;}
  .row:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .row::after{content:"›"; position:absolute; right:6px; top:50%; transform:translateY(-50%); color:#3e3e3a; font-size:14px;}

  .cell{display:flex; gap:2px;}
  .ch{
    font-family:'Oswald',sans-serif; font-weight:500;
    width:var(--cw); height:calc(var(--cw)*1.5); line-height:calc(var(--cw)*1.5);
    font-size:calc(var(--cw)*1.12); text-align:center; flex:0 0 var(--cw);
    background:linear-gradient(180deg,var(--flap-hi) 0%, var(--flap) 48%, #161616 52%, var(--flap) 100%);
    border-radius:2px; color:var(--cream); position:relative; overflow:hidden;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06), inset 0 -1px 2px rgba(0,0,0,.5);
  }
  .ch::after{content:""; position:absolute; left:0; right:0; top:50%; height:1px; background:var(--split);}
  .ch.flip{animation:flap .07s linear;}
  @keyframes flap{0%{transform:scaleY(1)}50%{transform:scaleY(.12)}100%{transform:scaleY(1)}}
  .c-flt .ch, .c-gate .ch{color:var(--cream-dim); font-size:calc(var(--cw)*1.0);}
  .row[data-status="FINAL CALL"] .c-status .ch{color:var(--red); animation:urgent 1s steps(1) infinite;}
  .row[data-status="DEPARTED"] .ch{color:#5f5f59;}
  .row[data-status="DELAYED"] .c-status .ch{color:var(--accent);}
  .row[data-status="CANCELLED"] .c-status .ch{color:var(--red);}
  .row.showstopper .c-dest .ch{color:var(--accent);}
  @keyframes urgent{50%{opacity:.25;}}

  .board-note{text-align:center; font-size:11px; letter-spacing:.26em; text-transform:uppercase; color:#52524d; padding:10px 4px 2px;}

  /* responsive: flap width derived from viewport so the board always fits.
     desktop: 42 chars/row + gaps & padding · mobile: 32 chars/row (3 columns) */
  :root{--cw:clamp(9px, calc((100vw - 190px) / 42), 17px);}
  @media (max-width:640px){
    .head, .row{grid-template-columns:5fr 17fr 10fr;}
    .c-flt,.c-gate,.h-flt,.h-gate{display:none;}
    :root{--cw:clamp(6.5px, calc((100vw - 140px) / 32), 13px);}
  }

  /* ---------- PA toast ---------- */
  .pa{position:fixed; left:50%; bottom:18px; transform:translate(-50%,140%); width:min(640px,92vw);
    background:#151515ee; border:1px solid #333; border-left:5px solid var(--accent);
    border-radius:10px; padding:13px 16px 13px 14px; z-index:60; backdrop-filter:blur(6px);
    transition:transform .45s cubic-bezier(.2,.9,.25,1.1); box-shadow:0 12px 40px rgba(0,0,0,.6);}
  .pa.show{transform:translate(-50%,0);}
  .pa .who{font-size:10px; letter-spacing:.32em; text-transform:uppercase; color:var(--label); margin:0 0 4px;}
  .pa .msg{margin:0; font-size:15px; line-height:1.45; color:var(--cream);}

  /* ---------- Story modal ---------- */
  .modal{position:fixed; inset:0; z-index:80; display:none; align-items:center; justify-content:center; padding:18px;
    background:rgba(8,7,5,.78); backdrop-filter:blur(4px);}
  .modal.open{display:flex;}
  .card{width:min(560px,100%); max-height:92vh; overflow:auto; background:#f4ecdb; color:#2c261c;
    border-radius:12px; box-shadow:0 30px 80px rgba(0,0,0,.7); position:relative;
    border:6px solid #fffdf6; outline:1px solid #d8cdb4;}
  .card .scene{display:block; width:100%; aspect-ratio:5/3;}
  .card .body{padding:18px 22px 22px;}
  .card .route{font-size:10px; letter-spacing:.3em; text-transform:uppercase; color:#9b8c6b; margin:0 0 6px;}
  .card h2{font-family:'Oswald',sans-serif; font-weight:600; letter-spacing:.06em; text-transform:uppercase; font-size:22px; margin:0 0 10px; color:#3d3014;}
  .card p.story{margin:0; font-size:15.5px; line-height:1.65;}
  .card .meta{display:flex; gap:18px; margin-top:16px; padding-top:14px; border-top:1px dashed #cdbf9f;
    font-family:'Oswald',sans-serif; font-size:13px; letter-spacing:.12em; color:#7a6c4d; text-transform:uppercase;}
  .closex{position:absolute; top:8px; right:8px; width:34px; height:34px; border-radius:50%;
    border:none; background:rgba(20,17,12,.55); color:#fff; font-size:17px; cursor:pointer; z-index:2;}
  .stamp{position:absolute; top:12px; left:12px; z-index:2; font-family:'Oswald',sans-serif; font-size:10px;
    letter-spacing:.22em; color:#fffdf6cc; border:1.5px solid #fffdf6aa; border-radius:6px; padding:5px 9px;
    transform:rotate(-6deg); text-transform:uppercase; backdrop-filter:blur(2px); background:rgba(20,17,12,.25);}

  /* ---------- Takeoff overlay ---------- */
  .takeoff{position:fixed; inset:0; z-index:70; pointer-events:none; overflow:hidden; display:none;}
  .takeoff.go{display:block;}
  .jet{position:absolute; left:-180px; bottom:18vh; width:clamp(110px,18vw,200px);
    animation:fly 3.1s cubic-bezier(.35,.1,.45,.9) forwards;
    filter:drop-shadow(0 6px 14px rgba(0,0,0,.55));}
  @keyframes fly{
    0%{transform:translate(0,0) rotate(0deg); opacity:0;}
    8%{opacity:1;}
    100%{transform:translate(calc(100vw + 360px), calc(-46vh)) rotate(-13deg); opacity:1;}
  }
  .contrail{position:absolute; left:0; bottom:calc(18vh + 1.2em); height:3px; width:0; border-radius:3px;
    background:linear-gradient(90deg, transparent, rgba(244,236,219,.0) 10%, rgba(244,236,219,.55));
    transform-origin:left bottom; transform:rotate(-13deg); animation:trail 3.1s cubic-bezier(.35,.1,.45,.9) forwards;}
  @keyframes trail{0%{width:0; opacity:0;} 15%{opacity:.8;} 100%{width:140vw; opacity:0;}}

  canvas.confetti{position:fixed; inset:0; z-index:65; pointer-events:none;}

  /* ---------- Destination Spotlight (big screens, self-running) ---------- */
  .spotlight{position:fixed; inset:0; z-index:55; display:flex; align-items:center; justify-content:center;
    padding:24px; background:rgba(5,5,5,.72); backdrop-filter:blur(3px);
    opacity:0; pointer-events:none; transition:opacity .6s ease;}
  .spotlight.show{opacity:1; pointer-events:auto;}
  .sp-card{display:grid; grid-template-columns:minmax(300px,420px) 1fr; width:min(860px,94vw);
    background:#f4ecdb; color:#2c261c; border-radius:14px; overflow:hidden;
    border:6px solid #fffdf6; outline:1px solid #d8cdb4; box-shadow:0 36px 90px rgba(0,0,0,.75);
    transform:translateY(14px) scale(.985); transition:transform .6s cubic-bezier(.2,.8,.25,1);}
  .spotlight.show .sp-card{transform:translateY(0) scale(1);}
  .sp-scene svg{display:block; width:100%; height:100%; object-fit:cover;}
  .sp-body{padding:24px 28px; display:flex; flex-direction:column; justify-content:center;}
  .sp-kicker{margin:0 0 8px; font-size:10px; letter-spacing:.34em; text-transform:uppercase; color:#9b8c6b;}
  .sp-kicker b{color:#7a6c4d; font-weight:600;}
  .sp-body h3{font-family:'Oswald',sans-serif; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
    font-size:24px; margin:0 0 10px; color:#3d3014;}
  .sp-body p.sp-story{margin:0; font-size:15px; line-height:1.6;}
  .sp-meta{margin:16px 0 0; padding-top:13px; border-top:1px dashed #cdbf9f;
    font-family:'Oswald',sans-serif; font-size:13px; letter-spacing:.12em; color:#7a6c4d; text-transform:uppercase;}

  footer{padding:6px 16px 26px; font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:#464642; text-align:center;}
  footer a{color:#62625c; text-decoration:none;}
  footer a:hover{color:var(--accent);}

  @media (prefers-reduced-motion:reduce){
    .ch.flip{animation:none;}
    .row[data-status="FINAL CALL"] .c-status .ch{animation:none;}
  }
</style>
</head>
<body>

<div class="sign-wrap">
  <div class="sign">
    <div class="signline">
      <span class="picto" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M2.5 19h19v2h-19v-2zm19.57-9.36c-.21-.8-1.04-1.28-1.84-1.06L14.92 10 8.46 3.98l-1.93.51 3.87 6.7-4.95 1.33-1.84-1.45-1.45.39 1.82 3.16.77 1.33 1.6-.43 5.31-1.42 4.35-1.16 5.16-1.38c.81-.23 1.28-1.05 1.07-1.86z"/></svg>
      </span>
      <h1>Christie Lee International</h1>
    </div>
    <p class="tag">Celebrating 40 Years of First-Class Travel</p>
  </div>
</div>

<div class="strip">
  <div class="left">
    <span class="dep">Departures</span>
    <span class="clock" id="clock">--:--:--</span>
  </div>
  <div class="controls">
    <button class="pillbtn" id="soundBtn" aria-pressed="false">🔇 Announcements off</button>
  </div>
</div>

<div class="board-wrap">
  <div class="board" role="table" aria-label="Departure board">
    <div class="head" role="row">
      <div class="r">Time</div><div class="r">Destination</div>
      <div class="r h-flt">Flight</div><div class="r h-gate">Gate</div><div class="r">Remarks</div>
    </div>
    <div id="rows"></div>
    <p class="board-note">Tap any flight to read its story</p>
  </div>
</div>

<footer>
  Christie Lee International · est. 1986 · <a href="editor.html">ground crew</a>
</footer>

<div class="pa" id="pa" role="status" aria-live="polite">
  <p class="who" id="paWho">CLI Public Address</p>
  <p class="msg" id="paMsg"></p>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="cardTitle">
  <div class="card">
    <button class="closex" id="closeModal" aria-label="Close">✕</button>
    <div class="stamp">CLI · Boarding pass</div>
    <div id="cardScene"></div>
    <div class="body">
      <p class="route" id="cardRoute"></p>
      <h2 id="cardTitle"></h2>
      <p class="story" id="cardStory"></p>
      <div class="meta" id="cardMeta"></div>
    </div>
  </div>
</div>

<div class="takeoff" id="takeoff"></div>
<canvas class="confetti" id="confetti" width="10" height="10" style="display:none"></canvas>

<div class="spotlight" id="spotlight" aria-hidden="true">
  <div class="sp-card">
    <div class="sp-scene" id="spScene"></div>
    <div class="sp-body">
      <p class="sp-kicker">Destination Spotlight · <b id="spStatus">Now Boarding</b></p>
      <h3 id="spTitle"></h3>
      <p class="sp-story" id="spStory"></p>
      <p class="sp-meta" id="spMeta"></p>
    </div>
  </div>
</div>

<script src="flights.js"></script>
<script src="scenes.js"></script>
<script>
(function(){
  "use strict";
  const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const CHARS = " ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789:-–'•.";
  const WIDTHS = { time:5, dest:17, flt:7, gate:3, status:10 };

  /* ============================================================
     FLIGHT DATA — booth nations are permanent; ground-crew
     additions merge in; novelty flights rotate hourly.
     ============================================================ */
  let baseFlights = window.FLIGHTS.slice();
  try{
    const ov = JSON.parse(localStorage.getItem('clia_overrides_v1') || 'null');
    if(ov && Array.isArray(ov.added)) ov.added.forEach(f => baseFlights.push(f));
  }catch(e){ /* storage unavailable — run the stock show */ }

  const NOVELTY = baseFlights.filter(f => f.novelty);
  const PERMANENT = baseFlights.filter(f => !f.novelty);
  const NOVELTY_SHOWN = 3;

  function activeFlights(now){
    if(!NOVELTY.length) return PERMANENT;
    const hourKey = now.getDate()*24 + now.getHours();
    const start = hourKey % NOVELTY.length;
    const chosen = [];
    for(let i=0; i<Math.min(NOVELTY_SHOWN, NOVELTY.length); i++)
      chosen.push(NOVELTY[(start+i) % NOVELTY.length]);
    return PERMANENT.concat(chosen);
  }

  /* ============================================================
     SPOKEN ANNOUNCEMENT TEXT — restored formal CLI house style
     ============================================================ */
  function ftts(code){ const m = code.match(/^([A-Z]+)-?(\w+)$/); return m ? m[1].split('').join(' ') + ' ' + m[2] : code; }
  function gstr(g){ return String(g).replace(/([A-Z])(\d+)/, '$1 $2'); }
  function tc(s){ return s.split(' ').map(w => w[0] + w.slice(1).toLowerCase()).join(' '); }
  function aln(f){ return f.airline || 'Captain Air'; }
  function boardingTxt(f){
    return 'Ladies and gentlemen, ' + aln(f) + ' flight ' + ftts(f.flight) + ' service to ' + tc(f.dest)
      + ' is now boarding at gate ' + gstr(f.gate) + '. All passengers please have your boarding passes and travel documents ready, and proceed to gate '
      + gstr(f.gate) + ' at this time. Thank you.';
  }
  function lastCallTxt(f){
    return 'Last call. Last call for passengers on ' + aln(f) + ' flight ' + ftts(f.flight) + ' to ' + tc(f.dest)
      + '. This is the final boarding call. Please proceed immediately to gate ' + gstr(f.gate) + '. The gate is now closing.';
  }
  function departedTxt(f){
    return aln(f) + ' flight ' + ftts(f.flight) + ' to ' + tc(f.dest) + ' has now departed. We wish all passengers a very pleasant journey.';
  }
  function paFor(f, kind){
    if(f.pa && f.pa[kind]) return f.pa[kind];
    if(kind === 'boarding') return boardingTxt(f);
    if(kind === 'final') return lastCallTxt(f);
    if(kind === 'departed') return departedTxt(f);
    return null;
  }

  /* ============================================================
     VOICES — four announcers built from the device's speech
     engine, separated by voice / pitch / pace.
     ============================================================ */
  const ANNOUNCERS = [
    { label:'Terminal announcer', vi:0, rate:1.0,  pitch:1.0 },
    { label:'Gate announcer',     vi:1, rate:0.97, pitch:1.05 }
  ];
  let roster = [], allVoices = [];
  function voiceScore(v){
    let s = 0; const n = v.name || '';
    if(/natural/i.test(n)) s += 5;
    if(/neural/i.test(n))  s += 4;
    if(/google/i.test(n))  s += 3;
    if(/premium|enhanced/i.test(n)) s += 3;
    if(/online/i.test(n))  s += 2;
    if(v.localService === false) s += 2;   // network voices usually sound best
    if(/^en[-_]us/i.test(v.lang || '')) s += 1;
    return s;
  }
  function buildRoster(){
    try{
      allVoices = speechSynthesis.getVoices() || [];
      const en = allVoices.filter(v => v.lang && v.lang.toLowerCase().indexOf('en') === 0);
      const seen = {}; const uniq = [];
      en.forEach(v => { if(!seen[v.name]){ seen[v.name] = 1; uniq.push(v); } });
      roster = uniq.sort((a,b) => voiceScore(b) - voiceScore(a));   // best voices first
    }catch(e){ roster = []; allVoices = []; }
  }
  function langVoice(code){
    code = code.toLowerCase();
    // prefer Google/enhanced voices when several match
    const matches = allVoices.filter(v => v.lang && v.lang.toLowerCase().indexOf(code) === 0);
    if(!matches.length) return null;
    return matches.find(v => /google/i.test(v.name)) || matches[0];
  }
  if('speechSynthesis' in window){
    buildRoster();
    speechSynthesis.addEventListener('voiceschanged', buildRoster);
  }
  function speak(text, conf){
    return new Promise(resolve => {
      if(!('speechSynthesis' in window)){ resolve(); return; }
      try{
        const u = new SpeechSynthesisUtterance(text);
        if(conf.voice) u.voice = conf.voice;
        if(conf.lang) u.lang = conf.lang;
        u.rate = conf.rate || 1; u.pitch = conf.pitch || 1; u.volume = 1;
        let done = false;
        const finish = () => { if(done) return; done = true; clearInterval(keep); clearTimeout(guard); resolve(); };
        // Chrome quietly stops long utterances; nudge it every 10s
        const keep = setInterval(() => { try{ speechSynthesis.pause(); speechSynthesis.resume(); }catch(e){} }, 10000);
        const guard = setTimeout(finish, 60000);
        u.onend = finish; u.onerror = finish;
        speechSynthesis.speak(u);
      }catch(e){ resolve(); }
    });
  }

  /* ============================================================
     CHIME — the original three-note descending G–E–C
     ============================================================ */
  let audioOn = false, ctx = null;
  function tone(freq, t0, dur){
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(.22, t0 + .03);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t0); o.stop(t0 + dur + .05);
  }
  function chime(){
    return new Promise(resolve => {
      if(!audioOn || !ctx){ resolve(); return; }
      try{
        const t = ctx.currentTime + .02;
        tone(783.99, t, .5);        // G5
        tone(659.25, t + .32, .5);  // E5
        tone(523.25, t + .64, .75); // C5
        setTimeout(resolve, 1500);
      }catch(e){ resolve(); }
    });
  }

  /* ---------- mechanical flap clatter ---------- */
  let clickBuf = null, lastClick = 0;
  function clack(){
    if(!audioOn || !ctx || REDUCED) return;
    const now = performance.now();
    if(now - lastClick < 26) return;     // throttle to a flutter, not a buzz
    lastClick = now;
    try{
      if(!clickBuf){
        const len = Math.floor(ctx.sampleRate * 0.004);
        clickBuf = ctx.createBuffer(1, len, ctx.sampleRate);
        const d = clickBuf.getChannelData(0);
        for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 2);
      }
      const src = ctx.createBufferSource();
      src.buffer = clickBuf;
      src.playbackRate.value = 0.8 + Math.random()*0.5;
      const bp = ctx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = 2000 + Math.random()*1600;
      bp.Q.value = 1.1;
      const g = ctx.createGain();
      g.gain.value = 0.045 + Math.random()*0.03;
      src.connect(bp); bp.connect(g); g.connect(ctx.destination);
      src.start();
    }catch(e){}
  }

  /* ---------- sound toggle (kept light for responsiveness) ---------- */
  const soundBtn = document.getElementById('soundBtn');
  soundBtn.addEventListener('click', () => {
    audioOn = !audioOn;
    soundBtn.classList.toggle('on', audioOn);
    soundBtn.setAttribute('aria-pressed', String(audioOn));
    soundBtn.textContent = audioOn ? '🔔 Announcements on' : '🔇 Announcements off';
    if(audioOn && 'speechSynthesis' in window){
      // tiny utterance inside the gesture unlocks speech on iOS
      try{ speechSynthesis.cancel(); speechSynthesis.speak(new SpeechSynthesisUtterance(' ')); }catch(e){}
    }
    // heavy audio setup happens off the click handler
    setTimeout(() => {
      if(audioOn){
        if(!ctx){ try{ ctx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){} }
        if(ctx && ctx.state === 'suspended') ctx.resume();
        buildRoster();
        announce('Good evening. This is a sound check from Christie Lee International. Announcements are now on.', { announcer: 0 });
      } else {
        try{ speechSynthesis.cancel(); }catch(e){}
        clearTimeout(fillerTimer);
      }
    }, 0);
  });

  /* ============================================================
     PA QUEUE — chime, then speech, never overlapping
     ============================================================ */
  const paEl = document.getElementById('pa'), paMsg = document.getElementById('paMsg'), paWho = document.getElementById('paWho');
  const Q = []; let running = false, annRot = 0;
  const wait = ms => new Promise(r => setTimeout(r, ms));
  function announce(text, opts){
    clearTimeout(fillerTimer);
    Q.push({ text, opts: opts || {} });
    if(Q.length > 6) Q.shift();
    if(!running) drain();
  }
  async function drain(){
    if(!Q.length){
      running = false;
      scheduleFiller();          // keep the terminal talking
      return;
    }
    running = true;
    const item = Q.shift();
    const a = ANNOUNCERS[(item.opts.announcer != null ? item.opts.announcer : annRot++) % ANNOUNCERS.length];
    paWho.textContent = 'CLI Public Address — ' + a.label;
    paMsg.textContent = item.text;
    paEl.classList.add('show');
    if(audioOn){
      await chime();
      const v = roster.length ? roster[a.vi % roster.length] : null;
      await speak(item.text, { voice: v, rate: a.rate, pitch: a.pitch });
      /* destination-language repeat: first variant with an installed voice wins */
      if(item.opts.also && item.opts.also.length){
        for(const seg of item.opts.also){
          const lv = langVoice(seg.lang);
          if(lv){
            await wait(350);
            paMsg.textContent = seg.text;
            await speak(seg.text, { voice: lv, lang: seg.lang, rate: 0.98 });
            break;
          }
        }
      }
      await wait(500);
    } else {
      await wait(8000);
    }
    paEl.classList.remove('show');
    await wait(600);
    drain();
  }

  /* ---------- continuous filler: if the PA goes quiet, the next
     ambient announcement starts within ~7 seconds ---------- */
  let fillerTimer = null, ambPtr = new Date().getHours() % 10;
  function scheduleFiller(){
    if(!audioOn) return;                       // silent devices use the timed toasts instead
    clearTimeout(fillerTimer);
    fillerTimer = setTimeout(() => {
      if(!audioOn || running || Q.length){ return; }
      if(document.hidden){ scheduleFiller(); return; }
      const item = window.AMBIENT[ambPtr++ % window.AMBIENT.length];
      announce(item.time ? localTimeText(new Date()) : item.text, { announcer: item.announcer });
    }, 7000);
  }

  /* ---------- live announcements from the ground crew page ---------- */
  window.addEventListener('storage', e => {
    if(e.key !== 'clia_live_announcement' || !e.newValue) return;
    try{
      const d = JSON.parse(e.newValue);
      if(d && d.text) announce(d.text, { announcer: d.announcer });
    }catch(err){}
  });

  /* ============================================================
     SPLIT-FLAP CELLS
     ============================================================ */
  function makeCell(klass, width){
    const cell = document.createElement('div');
    cell.className = 'cell ' + klass;
    cell._spans = []; cell._txt = '';
    for(let i=0;i<width;i++){
      const s = document.createElement('span');
      s.className = 'ch'; s.textContent = ' ';
      cell.appendChild(s); cell._spans.push(s);
    }
    return cell;
  }
  function setCell(cell, text, instant){
    text = (text||'').toUpperCase().slice(0, cell._spans.length).padEnd(cell._spans.length,' ');
    if(text === cell._txt) return;
    cell._txt = text;
    cell._spans.forEach((span, i) => {
      const target = text[i];
      if(span.textContent === target) return;
      if(REDUCED || instant){ span.textContent = target; return; }
      const startDelay = i * 28;
      let hops = 4 + Math.floor(Math.random()*5);
      let idx = CHARS.indexOf(span.textContent); if(idx<0) idx = 0;
      setTimeout(function step(){
        span.classList.remove('flip'); void span.offsetWidth; span.classList.add('flip');
        clack();
        if(hops-- <= 0 || span.textContent === target){ span.textContent = target; span.classList.remove('flip'); return; }
        idx = (idx + 1 + Math.floor(Math.random()*3)) % CHARS.length;
        span.textContent = CHARS[idx];
        setTimeout(step, 55);
      }, startDelay);
    });
  }

  /* ---------- rows ---------- */
  const rowsEl = document.getElementById('rows');
  const slots = [];
  function makeSlot(){
    const row = document.createElement('div');
    row.className = 'row'; row.setAttribute('role','row'); row.tabIndex = 0;
    const c = {
      time: makeCell('c-time', WIDTHS.time),
      dest: makeCell('c-dest', WIDTHS.dest),
      flt:  makeCell('c-flt',  WIDTHS.flt),
      gate: makeCell('c-gate', WIDTHS.gate),
      status: makeCell('c-status', WIDTHS.status)
    };
    row.append(c.time, c.dest, c.flt, c.gate, c.status);
    row.addEventListener('click', () => { if(row._flight) openStory(row._flight); });
    row.addEventListener('keydown', e => { if((e.key==='Enter'||e.key===' ') && row._flight){ e.preventDefault(); openStory(row._flight);} });
    rowsEl.appendChild(row);
    return { row, c };
  }
  function ensureSlots(n){
    while(slots.length < n) slots.push(makeSlot());
    while(slots.length > n){ const s = slots.pop(); s.row.remove(); }
  }

  /* ============================================================
     SHOW ENGINE — wall-clock synced
     ============================================================ */
  function nextDeparture(f, now){
    if(f.departMin == null) return null;
    const d = new Date(now);
    d.setMinutes(f.departMin, 0, 0);
    if((now - d) / 60000 >= 3) d.setHours(d.getHours()+1);
    return d;
  }
  function statusFor(f, now){
    if(f.fixedStatus) return f.fixedStatus;
    const dep = nextDeparture(f, now);
    const mins = (dep - now) / 60000;
    if(mins <= 0) return 'DEPARTED';
    if(mins <= 4) return 'FINAL CALL';
    if(mins <= 10) return 'BOARDING';
    if(mins <= 25) return 'CHECK IN';
    return 'ON TIME';
  }
  function fmt(d){ return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }

  /* ambient rotation — one announcement every 3 minutes, cycling in order */
  const AMBIENT_MINS = [1,4,7,10,13,16,19,22,25,28,31,34,37,40,43,46,49,52,55,58];
  function localTimeText(now){
    let h = now.getHours() % 12; if(h === 0) h = 12;
    const mm = String(now.getMinutes()).padStart(2,'0');
    const ap = now.getHours() < 12 ? 'A M' : 'P M';
    return 'Christie Lee International: the local time is ' + h + ' ' + mm + ' ' + ap +
      '. We thank you for choosing Captain Air, and we wish you a pleasant evening.';
  }

  const lastStatus = {};
  let firstPaint = true;

  function tick(){
    const now = new Date();
    document.getElementById('clock').textContent =
      fmt(now) + ':' + String(now.getSeconds()).padStart(2,'0');

    const ordered = activeFlights(now).slice().sort((a,b)=>{
      const da = a.departMin==null ? Infinity : nextDeparture(a, now) - now;
      const db = b.departMin==null ? Infinity : nextDeparture(b, now) - now;
      return da - db;
    });
    ensureSlots(ordered.length);

    ordered.forEach((f, i) => {
      const slot = slots[i];
      const st = statusFor(f, now);
      const dep = nextDeparture(f, now);
      slot.row._flight = f;
      slot.row.dataset.status = st;
      slot.row.classList.toggle('showstopper', !!f.showstopper);
      slot.row.setAttribute('aria-label', f.dest + ', flight ' + f.flight + ', ' + st);
      setCell(slot.c.time, f.departMin==null ? '--:--' : fmt(dep), firstPaint);
      setCell(slot.c.dest, f.dest, firstPaint);
      setCell(slot.c.flt, f.flight, firstPaint);
      setCell(slot.c.gate, f.gate, firstPaint);
      setCell(slot.c.status, st, firstPaint);

      const prev = lastStatus[f.id];
      if(prev && prev !== st && !document.hidden){
        if(st === 'BOARDING'){
          announce(paFor(f,'boarding'), { announcer: i % 2, also: f.i18n && f.i18n.boarding });
          showSpotlight(f);
        }
        if(st === 'FINAL CALL'){
          announce(paFor(f,'final'), { announcer: (i + 1) % 2, also: f.i18n && f.i18n.final });
        }
        if(st === 'DEPARTED'){
          announce(paFor(f,'departed'), { announcer: i % 2 });
          launchPlane(!!f.showstopper);
          if(f.showstopper) confetti();
        }
      }
      lastStatus[f.id] = st;
    });

    /* timed ambient toasts for muted devices (sound-on devices use the continuous filler) */
    if(!audioOn && !document.hidden && now.getSeconds() === 0 && window.AMBIENT && window.AMBIENT.length){
      const idx = AMBIENT_MINS.indexOf(now.getMinutes());
      if(idx >= 0){
        const hourKey = now.getDate()*24 + now.getHours();
        const item = window.AMBIENT[(hourKey * AMBIENT_MINS.length + idx) % window.AMBIENT.length];
        announce(item.time ? localTimeText(now) : item.text, { announcer: item.announcer });
      }
    }
    firstPaint = false;
  }
  tick();
  setInterval(tick, 1000);
  document.addEventListener('visibilitychange', () => {
    if(!document.hidden){
      tick();
      if(audioOn && !running && !Q.length) scheduleFiller();
    }
  });

  /* ============================================================
     STORY MODAL
     ============================================================ */
  const modal = document.getElementById('modal');
  function openStory(f){
    document.getElementById('cardScene').innerHTML = window.SCENES.render(f.scene, f.dest);
    document.getElementById('cardRoute').textContent = 'CLI → ' + f.dest + '  ·  ' + (f.airline || 'Captain Air') + ' ' + f.flight;
    document.getElementById('cardTitle').textContent = f.storyTitle || f.dest;
    document.getElementById('cardStory').textContent = f.story || '';
    document.getElementById('cardMeta').innerHTML =
      '<span>Gate ' + f.gate + '</span><span>' + (f.fixedStatus ? f.fixedStatus : 'Departs :' + String(f.departMin).padStart(2,'0') + ' hourly') + '</span>';
    modal.classList.add('open');
    document.getElementById('closeModal').focus();
  }
  document.getElementById('closeModal').addEventListener('click', ()=>modal.classList.remove('open'));
  modal.addEventListener('click', e=>{ if(e.target===modal) modal.classList.remove('open'); });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') modal.classList.remove('open'); });

  /* ============================================================
     DESTINATION SPOTLIGHT — self-running postcards for the TV.
     Shows when a flight starts boarding; phones are left alone.
     ============================================================ */
  const spotEl = document.getElementById('spotlight');
  let spotTimer = null;
  function showSpotlight(f){
    if(window.innerWidth < 900) return;                 // big screens only
    if(document.hidden) return;
    if(modal.classList.contains('open')) return;        // never fight a real user
    if(spotEl.classList.contains('show')) return;
    document.getElementById('spScene').innerHTML = window.SCENES.render(f.scene, f.dest);
    document.getElementById('spStatus').textContent = 'Now Boarding';
    document.getElementById('spTitle').textContent = f.storyTitle || f.dest;
    document.getElementById('spStory').textContent = f.story || '';
    document.getElementById('spMeta').textContent =
      'CLI → ' + f.dest + '  ·  ' + (f.airline || 'Captain Air') + ' ' + f.flight + '  ·  Gate ' + f.gate;
    spotEl.classList.add('show');
    spotEl.setAttribute('aria-hidden','false');
    clearTimeout(spotTimer);
    spotTimer = setTimeout(hideSpotlight, 18000);
  }
  function hideSpotlight(){
    clearTimeout(spotTimer);
    spotEl.classList.remove('show');
    spotEl.setAttribute('aria-hidden','true');
  }
  spotEl.addEventListener('click', hideSpotlight);

  /* ============================================================
     TAKEOFF + CONFETTI
     ============================================================ */
  const takeoff = document.getElementById('takeoff');
  function launchPlane(golden){
    if(REDUCED) return;
    const body = golden ? '#ffd25c' : '#f2f2ee';
    takeoff.innerHTML =
      '<div class="contrail"></div>' +
      '<svg class="jet" viewBox="0 0 200 80" aria-hidden="true">' +
        '<path d="M8 46 Q60 34 132 34 L168 34 Q190 35 193 41 Q190 47 168 48 L40 52 Q18 52 8 46 Z" fill="'+body+'"/>' +
        '<path d="M96 36 L70 8 L84 8 L116 35 Z" fill="'+body+'" opacity=".92"/>' +
        '<path d="M100 49 L84 70 L95 70 L118 50 Z" fill="'+body+'" opacity=".92"/>' +
        '<path d="M30 47 L16 30 L25 30 L44 46 Z" fill="'+body+'" opacity=".85"/>' +
        '<circle cx="150" cy="40" r="2.6" fill="#171511"/><circle cx="138" cy="40" r="2.6" fill="#171511"/>' +
        '<circle cx="126" cy="40" r="2.6" fill="#171511"/><circle cx="114" cy="40" r="2.6" fill="#171511"/>' +
        '<path d="M168 34 Q190 35 193 41 L165 41 Z" fill="#171511" opacity=".25"/>' +
      '</svg>';
    takeoff.classList.add('go');
    setTimeout(()=>{ takeoff.classList.remove('go'); takeoff.innerHTML=''; }, 3300);
  }

  const cvs = document.getElementById('confetti');
  function confetti(){
    if(REDUCED) return;
    const c = cvs.getContext('2d');
    cvs.width = innerWidth; cvs.height = innerHeight; cvs.style.display='block';
    const colors = ['#ffd25c','#f2f2ee','#ff6b5e','#ffffff','#bdbdb6'];
    const parts = Array.from({length:140},()=>({
      x:Math.random()*cvs.width, y:-20-Math.random()*cvs.height*.4,
      vy:2+Math.random()*3.5, vx:(Math.random()-.5)*2.4,
      s:5+Math.random()*6, r:Math.random()*Math.PI, vr:(Math.random()-.5)*.25,
      col:colors[Math.floor(Math.random()*colors.length)]
    }));
    let frames = 0;
    (function draw(){
      c.clearRect(0,0,cvs.width,cvs.height);
      parts.forEach(p=>{
        p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
        c.save(); c.translate(p.x,p.y); c.rotate(p.r);
        c.fillStyle=p.col; c.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66); c.restore();
      });
      if(++frames < 270) requestAnimationFrame(draw);
      else { cvs.style.display='none'; }
    })();
  }
})();
</script>
</body>
</html>
